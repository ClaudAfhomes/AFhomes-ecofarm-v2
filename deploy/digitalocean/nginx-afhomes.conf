# Install in sites-available only after domain/TLS/allowed-IP review.
# This is a staging template. It does not expose the application publicly by default.
log_format afhomes_private '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name staging.example.invalid;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 308 https://staging.example.invalid$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.example.invalid;
    ssl_certificate /etc/letsencrypt/live/staging.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Add the specifically approved administrator/tester public IPs before deny all.
    allow 127.0.0.1;
    allow ::1;
    deny all;

    root /srv/afhomes/current/vercel-static;
    index index.html;
    access_log /var/log/nginx/afhomes.access.log afhomes_private;
    error_log /var/log/nginx/afhomes.error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag 'noindex, nofollow' always;
    client_max_body_size 32m;

    location ^~ /api/ {
        # No trailing slash: preserve /api/v1/... for the native router.
        proxy_pass http://127.0.0.1:3084;
        proxy_http_version 1.1;
        proxy_set_header Host staging.example.invalid;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host staging.example.invalid;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_cache off;
        # Access logs omit query arguments, bodies and cookies. Protect/redact error logs separately.
        access_log /var/log/nginx/afhomes.api.access.log afhomes_private;
    }
    location ^~ /admin/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control 'public, immutable';
    }
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control 'public, immutable';
    }
    location = /admin { return 308 /admin/; }
    location /admin/ { try_files $uri $uri/ /admin/index.html; }
    location ~ ^/(staff|employee|finance|hr|sales)(/|$) { try_files /admin/index.html =404; }
    location ~ /\. { return 404; }
    location ~* \.(?:map|env|ts|tsx|log|afhb)$ { return 404; }
    location ~* \.(?:js|css|png|jpg|jpeg|webp|svg|ico|woff|woff2|ttf)$ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
